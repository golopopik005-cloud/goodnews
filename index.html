<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoodNews Live - Full Timed & Date</title>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes popReaction {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); filter: brightness(1.3); }
            100% { transform: scale(1); }
        }
        @keyframes floatButterfly {
            0% {
                transform: translate(0, 0) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            20% { opacity: 0.6; }
            80% { opacity: 0.6; }
            100% {
                transform: translate(var(--move-x), -110vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        body {
            background: linear-gradient(135deg, #090d16 0%, #0f172a 100%);
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .butterfly-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        .bg-butterfly {
            position: absolute;
            bottom: -50px;
            font-size: 1.5rem;
            animation: floatButterfly linear infinite;
            user-select: none;
        }

        h1, .server-status, .search-box, .categories, #feed, .modal {
            position: relative;
            z-index: 1;
        }

        h1 {
            text-align: center;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.6rem;
            margin-bottom: 5px;
        }
        .server-status {
            text-align: center;
            font-size: 0.8rem;
            color: #38bdf8;
            margin-bottom: 20px;
            background: rgba(56, 189, 248, 0.1);
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .date-badge {
            font-weight: 700;
            font-size: 0.9rem;
            color: #f8fafc;
        }
        .search-box {
            margin-bottom: 15px;
        }
        .search-input {
            width: 100%;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #f8fafc;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.9rem;
            outline: none;
            box-sizing: border-box;
        }
        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding-bottom: 5px;
            scrollbar-width: none;
        }
        .categories::-webkit-scrollbar { display: none; }
        .chip {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(51, 65, 85, 0.6);
            color: #94a3b8;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .chip.active {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: #0f172a;
            font-weight: 700;
        }
        .card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(51, 65, 85, 0.5);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 15px;
            animation: fadeIn 0.3s ease forwards;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: border-color 0.2s, transform 0.2s;
        }
        .card:hover {
            border-color: rgba(56, 189, 248, 0.5);
            transform: translateY(-2px);
        }
        .card-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 12px;
            background: #1e293b;
        }
        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
        }
        .tag {
            font-size: 0.75rem;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
            padding: 3px 10px;
            border-radius: 8px;
            white-space: nowrap;
        }
        .post-time {
            font-size: 0.75rem;
            color: #94a3b8;
            white-space: nowrap;
        }
        .title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: #f8fafc;
        }
        .text {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 15px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .reactions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        button.react-btn {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(51, 65, 85, 0.8);
            color: #f8fafc;
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s, border-color 0.2s;
        }
        button.react-btn.animate {
            animation: popReaction 0.35s ease;
        }
        button.react-btn.active {
            background: rgba(56, 189, 248, 0.18);
            border-color: #38bdf8;
            color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }
        .read-more {
            font-size: 0.8rem;
            color: #38bdf8;
            font-weight: 600;
            white-space: nowrap;
        }
        .loading {
            text-align: center;
            color: #94a3b8;
            padding: 20px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .modal-content {
            background: #1e293b;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            max-width: 600px;
            margin: 40px auto;
            padding: 24px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.5);
            animation: fadeIn 0.3s ease;
        }
        .modal-img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #f8fafc;
        }
        .modal-text {
            color: #cbd5e1;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .modal-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #334155;
            padding-top: 15px;
        }
        .original-link {
            background: #38bdf8;
            color: #0f172a;
            padding: 8px 16px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .close-btn {
            background: transparent;
            border: 1px solid #64748b;
            color: #94a3b8;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="butterfly-container" id="butterflyContainer"></div>

    <h1>GoodNews Live 🦋</h1>
    <div class="server-status" id="serverStatusBox">
        <div class="date-badge" id="currentDate">📅 Загрузка даты...</div>
        <div id="statusText">🌐 Подключение к официальным источникам...</div>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск по статьям..." oninput="filterNews()">
    </div>

    <div class="categories">
        <div class="chip active" onclick="setCategory('all', this)">Все</div>
        <div class="chip" onclick="setCategory('tech', this)">Технологии</div>
        <div class="chip" onclick="setCategory('world', this)">Мир</div>
    </div>

    <div id="feed">
        <div class="loading">Загрузка свежих материалов...</div>
    </div>

    <div id="newsModal" class="modal" onclick="closeModalOnBg(event)">
        <div class="modal-content">
            <img id="modalImg" class="modal-img" src="" alt="" style="display: none;">
            <div id="modalTag" class="tag"></div>
            <div id="modalTitle" class="modal-title"></div>
            <div id="modalText" class="modal-text"></div>
            <div class="modal-actions">
                <a id="modalLink" class="original-link" href="" target="_blank">Читать оригинал 🔗</a>
                <button class="close-btn" onclick="closeModal()">Закрыть</button>
            </div>
        </div>
    </div>

    <script>
        const availableReactions = ["👍", "❤️", "👎", "💩"];

        function displayCurrentDate() {
            const options = { day: 'numeric', month: 'long', year: 'numeric' };
            const todayStr = new Date().toLocaleDateString('ru-RU', options);
            document.getElementById('currentDate').innerText = `📅 Сегодня: ${todayStr}`;
        }

        function formatPubDate(pubDateStr) {
            if (!pubDateStr) return '';
            try {
                const date = new Date(pubDateStr);
                if (isNaN(date.getTime())) return '';
                
                const dateFormatted = date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
                const timeFormatted = date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                return `📅 ${dateFormatted} в ${timeFormatted}`;
            } catch (e) {
                return '';
            }
        }

        function initButterflies() {
            const container = document.getElementById('butterflyContainer');
            const butterflyCount = 7;

            for (let i = 0; i < butterflyCount; i++) {
                const b = document.createElement('div');
                b.className = 'bg-butterfly';
                b.innerText = '🦋';
                
                const leftPos = Math.random() * 100;
                const duration = 8 + Math.random() * 7;
                const delay = Math.random() * 8;
                const moveX = (-50 + Math.random() * 100) + 'px';

                b.style.left = leftPos + '%';
                b.style.animationDuration = duration + 's';
                b.style.animationDelay = delay + 's';
                b.style.setProperty('--move-x', moveX);

                container.appendChild(b);
            }
        }

        let allNews = [];
        let currentCategory = 'all';

        const rssFeeds = [
            { category: 'tech', tag: 'Технологии (Хабр)', url: 'https://habr.com/ru/rss/all/' },
            { category: 'world', tag: 'Мир (РИА)', url: 'https://ria.ru/export/rss2/index.xml' }
        ];

        async function fetchOfficialNews() {
            const feedContainer = document.getElementById('feed');
            let loadedItems = [];

            try {
                for (const source of rssFeeds) {
                    // Добавлено &_t= для обхода кэша сервера и получения самых свежих новостей
                    const apiURL = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(source.url)}&_t=${Date.now()}`;
                    const response = await fetch(apiURL);
                    const data = await response.json();

                    if (data.status === 'ok' && data.items) {
                        data.items.forEach((item, index) => {
                            let imageUrl = item.thumbnail || item.enclosure?.link || '';
                            if (!imageUrl && item.description) {
                                const imgMatch = item.description.match(/<img[^>]+src="([^">]+)"/);
                                if (imgMatch) imageUrl = imgMatch[1];
                            }

                            const cleanDescription = item.description.replace(/<[^>]*>?/gm, '');

                            loadedItems.push({
                                id: `${source.category}-${index}-${Date.now()}`,
                                category: source.category,
                                tag: source.tag,
                                title: item.title,
                                text: cleanDescription,
                                image: imageUrl,
                                link: item.link,
                                pubDate: item.pubDate
                            });
                        });
                    }
                }

                if (loadedItems.length > 0) {
                    allNews = loadedItems;
                    document.getElementById('statusText').innerText = `✅ Загружено ${allNews.length} статей. Лента активна!`;
                    renderFeed(allNews);
                } else {
                    feedContainer.innerHTML = `<div class="loading">Не удалось загрузить ленту.</div>`;
                }
            } catch (error) {
                feedContainer.innerHTML = `<div class="loading">Ошибка подключения к сети.</div>`;
            }
        }

        function getDefaultReactions() {
            let obj = {};
            availableReactions.forEach(emoji => {
                obj[emoji] = { count: 0, active: false };
            });
            return obj;
        }

        function renderFeed(newsList) {
            const feed = document.getElementById('feed');
            let savedData = JSON.parse(localStorage.getItem('news_data_timed_v4') || '{}');
            let html = '';

            newsList.forEach(item => {
                let reactions = savedData[item.id] || getDefaultReactions();
                
                const safeTitle = item.title.replace(/"/g, '&quot;');
                const safeText = item.text.replace(/"/g, '&quot;').replace(/\n/g, ' ');
                const formattedDateTime = formatPubDate(item.pubDate);

                let reactionsHtml = '';
                availableReactions.forEach(emoji => {
                    let rData = reactions[emoji] || { count: 0, active: false };
                    reactionsHtml += `
                        <button class="react-btn ${rData.active ? 'active' : ''}" onclick="toggleReaction('${item.id}', '${emoji}', this)">
                            ${emoji} <span class="count">${rData.count}</span>
                        </button>
                    `;
                });

                html += `
                    <div class="card" onclick="openModal('${safeTitle}', '${safeText}', '${item.image}', '${item.link}', '${item.tag}')">
                        ${item.image ? `<img class="card-img" src="${item.image}" alt="" loading="lazy">` : ''}
                        <div class="card-header-row">
                            <span class="tag">${item.tag}</span>
                            ${formattedDateTime ? `<span class="post-time">${formattedDateTime}</span>` : ''}
                        </div>
                        <div class="title">${item.title}</div>
                        <div class="text">${item.text}</div>
                        <div class="footer-row">
                            <div class="reactions" onclick="event.stopPropagation()">
                                ${reactionsHtml}
                            </div>
                            <span class="read-more">Читать →</span>
                        </div>
                    </div>
                `;
            });

            feed.innerHTML = html;
        }

        function openModal(title, text, image, link, tag) {
            const modal = document.getElementById('newsModal');
            const modalImg = document.getElementById('modalImg');
            
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalText').innerText = text;
            document.getElementById('modalTag').innerText = tag;
            document.getElementById('modalLink').href = link;

            if (image && image !== 'undefined' && image !== '') {
                modalImg.src = image;
                modalImg.style.display = 'block';
            } else {
                modalImg.style.display = 'none';
            }

            modal.style.display = 'block';
        }

        function closeModal() {
            document.getElementById('newsModal').style.display = 'none';
        }

        function closeModalOnBg(event) {
            if (event.target.id === 'newsModal') {
                closeModal();
            }
        }

        function toggleReaction(newsId, emoji, btn) {
            btn.classList.add('animate');
            setTimeout(() => btn.classList.remove('animate'), 350);

            let savedData = JSON.parse(localStorage.getItem('news_data_timed_v4') || '{}');
            if (!savedData[newsId]) {
                savedData[newsId] = getDefaultReactions();
            }

            let target = savedData[newsId][emoji];
            if (btn.classList.contains('active')) {
                btn.classList.remove('active');
                target.count = Math.max(0, target.count - 1);
                target.active = false;
            } else {
                btn.classList.add('active');
                target.count += 1;
                target.active = true;
            }

            btn.querySelector('.count').innerText = target.count;
            localStorage.setItem('news_data_timed_v4', JSON.stringify(savedData));
        }

        function setCategory(category, chipElement) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            chipElement.classList.add('active');
            currentCategory = category;
            filterNews();
        }

        function filterNews() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allNews.filter(item => {
                const matchesCategory = (currentCategory === 'all' || item.category === currentCategory);
                const matchesQuery = item.title.toLowerCase().includes(query) || item.text.toLowerCase().includes(query);
                return matchesCategory && matchesQuery;
            });
            renderFeed(filtered);
        }

        displayCurrentDate();
        initButterflies();
        fetchOfficialNews();
    </script>
</body>
</html>
